<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120f0c">
<meta name="description" content="Sigil — hand-gesture and voice visual playground">
<title>Sigil</title>
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/favicon-16.png" type="image/png" sizes="16x16">
<link rel="shortcut icon" href="favicon.ico" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="Sigil">
<meta property="og:description" content="Hand-gesture and voice visual playground">
<meta property="og:image" content="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <div class="wrap">
    <header class="hero">
      <img class="brand-mark" src="assets/logo-mark.png" width="88" height="88" alt="Sigil">
      <p class="eyebrow">hand · vision</p>
      <h1 class="brand">Sigil</h1>
      <p class="mode-line"><span id="modeLabel">در انتظار</span></p>
    </header>

    <div class="stage" id="stage" data-mode="idle">
      <div class="stage-glow" aria-hidden="true"></div>
      <video id="video" playsinline muted></video>
      <canvas id="output"></canvas>
      <canvas id="work" class="offscreen"></canvas>
      <canvas id="bg" class="offscreen"></canvas>
      <canvas id="tmp" class="offscreen"></canvas>
      <canvas id="mask" class="offscreen"></canvas>
      <canvas id="grade" class="offscreen"></canvas>
      <canvas id="freeze" class="offscreen"></canvas>
      <canvas id="trail" class="offscreen"></canvas>

      <div class="frame-ornament tl"></div>
      <div class="frame-ornament tr"></div>
      <div class="frame-ornament bl"></div>
      <div class="frame-ornament br"></div>
      <div class="scanline" id="scanline"></div>
      <div class="flash" id="flash" aria-hidden="true">
        <div class="flash-core"></div>
        <div class="flash-ring r1"></div>
        <div class="flash-ring r2"></div>
        <div class="flash-wipe"></div>
        <div class="flash-bars"></div>
        <div class="flash-title" id="flashTitle"></div>
      </div>

      <div class="hud">
        <span id="handTag">—</span>
        <span id="stateTag">idle</span>
      </div>

      <div class="calibrate-banner" id="calibrateBanner"></div>

      <div class="overlay-msg" id="startOverlay">
        <div class="overlay-card">
          <img class="overlay-rune" src="assets/logo-mark.png" width="72" height="72" alt="" aria-hidden="true">
          <button id="startBtn" type="button">گشودن دریچه</button>
        </div>
      </div>
    </div>

        <div class="sigil-board" id="sigilDock">
      <section class="sigil-group">
        <header class="sigil-group-head">
          <span class="sigil-group-num">I</span>
          <div class="sigil-group-copy">
            <h2>One Hand</h2>
            <p>یک دست جلوی دوربین</p>
          </div>
        </header>
        <div class="sigil-rows">
      <div class="sigil-row">
        <div class="sigil-rail sigil-rail-5" role="listbox" aria-label="تک‌دست">
<button class="sigil" data-mode="beam" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M30 42V14a3.5 3.5 0 0 1 7 0v28"/>
            <path d="M37 44v-8a3 3 0 0 1 5.5-1"/>
            <path d="M42 46v-4a3 3 0 0 1 5 1"/>
            <path d="M24 42c-2.5-1-5-3.5-5-7a3.5 3.5 0 0 1 6-2.5"/>
            <path d="M30 42h14l1 5a11 11 0 0 1-11 12h-1A12 12 0 0 1 21 47v-2z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Beam</span>
          <span class="sigil-hint">۱ انگشت</span>
        </span>
      </button>
<button class="sigil" data-mode="mirror" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

            <path d="M22 40c-2-1-4-3-4-6a3.5 3.5 0 0 1 6-2.5"/>
            <path d="M26 40h16l1.5 6A11 11 0 0 1 32 58h-1A12 12 0 0 1 19 46v-2z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Mirror</span>
          <span class="sigil-hint">۲ انگشت</span>
        </span>
      </button>
<button class="sigil" data-mode="rift" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

        </span>
        <span class="sigil-text">
          <span class="sigil-name">Rift</span>
          <span class="sigil-hint">۳ انگشت</span>
        </span>
      </button>
<button class="sigil" data-mode="prism" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 38V16a3 3 0 0 1 6 0v16"/>
            <path d="M28 36V14a3 3 0 0 1 6 0v20"/>
            <path d="M34 36V14a3 3 0 0 1 6 0v20"/>
            <path d="M40 38V18a3 3 0 0 1 6 0v22"/>
            <path d="M22 38h24l1 5A11 11 0 0 1 36 56h-2A13 13 0 0 1 21 43v-2z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Prism</span>
          <span class="sigil-hint">۴ انگشت</span>
        </span>
      </button>
<button class="sigil" data-mode="clear" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 36V18a4 4 0 0 1 8 0v14"/>
            <path d="M28 32V14a4 4 0 0 1 8 0v20"/>
            <path d="M36 34V16a4 4 0 0 1 8 0v22"/>
            <path d="M44 38V24a4 4 0 0 1 7 2.6L49 48a12 12 0 0 1-12 10h-5A14 14 0 0 1 18 44v-4"/>
            <path d="M20 36c-3-1.5-6-4-6-8a4 4 0 0 1 7-2.5"/>

        </span>

          <span class="sigil-name">Reveal</span>
          <span class="sigil-hint">۵ انگشت</span>
        </span>
      </button>
        </div>
      </div>
      <div class="sigil-row">
        <div class="sigil-rail sigil-rail-5" role="listbox" aria-label="تک‌دست">
<button class="sigil" data-mode="cloak" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 30v-4a4 4 0 0 1 8 0v4"/>
            <path d="M30 30v-6a4 4 0 0 1 8 0v6"/>
            <path d="M38 30v-4a4 4 0 0 1 8 0v8"/>
            <path d="M20 32c-3-1.2-6-3-6-7a4 4 0 0 1 7-3c1.5 0 2.5.8 3 1.8"/>
            <path d="M22 30h20l2 8a12 12 0 0 1-12 14h-2A13 13 0 0 1 17 40v-4z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Phantom</span>
          <span class="sigil-hint">مشت</span>
        </span>
      </button>
<button class="sigil" data-mode="still" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M28 36c-1-6-2-12 2-16a5 5 0 0 1 8 4c0 3-2 6-3 9"/>
            <path d="M28 38h16l1.2 5A11 11 0 0 1 34 56h-1A12 12 0 0 1 21 44v-3z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Still</span>
          <span class="sigil-hint">شست بالا</span>
        </span>
      </button>
<button class="sigil" data-mode="down" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M36 28c1 6 2 12-2 16a5 5 0 0 1-8-4c0-3 2-6 3-9"/>
            <path d="M22 26h16l-1.2 8A11 11 0 0 1 26 48h-1A12 12 0 0 1 13 36v-4z" transform="rotate(180 32 36)"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Down</span>
          <span class="sigil-hint">شست پایین</span>
        </span>
      </button>
<button class="sigil" data-mode="ember" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 42V16a3.5 3.5 0 0 1 7 0v26"/>
            <path d="M24 40c-1-5 0-10 5-13"/>
            <path d="M32 42h14l.8 4A11 11 0 0 1 36 58h-1A12 12 0 0 1 23 46v-3z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Ember</span>
          <span class="sigil-hint">شکل L</span>
        </span>
      </button>
<button class="sigil" data-mode="okay" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="28" cy="28" r="7"/>
            <path d="M34 34V16a3 3 0 0 1 6 0v20"/>
            <path d="M40 36V18a3 3 0 0 1 6 0v20"/>
            <path d="M30 40h18l1 4A10 10 0 0 1 39 56h-1A11 11 0 0 1 27 45v-2z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Okay</span>
          <span class="sigil-hint">اوکی</span>
        </span>
      </button>
        </div>
      </div>
      <div class="sigil-row">
        <div class="sigil-rail sigil-rail-5" role="listbox" aria-label="تک‌دست">
<button class="sigil" data-mode="void" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="30" cy="30" r="6"/>
            <path d="M28 40h14l1 3A9 9 0 0 1 34 54h-1A10 10 0 0 1 23 44v-2z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Void</span>
          <span class="sigil-hint">نیشگون</span>
        </span>
      </button>
<button class="sigil" data-mode="spark" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M40 40V16a3.2 3.2 0 0 1 6.4 0v24"/>
            <path d="M28 42h20l1 4A11 11 0 0 1 38 58h-1A12 12 0 0 1 25 46v-2z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Spark</span>
          <span class="sigil-hint">انگشت کوچک</span>
        </span>
      </button>
<button class="sigil" data-mode="echo" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 36c-2-5 0-11 5-13"/>
            <path d="M40 22c3 1 5 5 4 10v10"/>
            <path d="M29 40h15l1 5A11 11 0 0 1 34 58h-1A12 12 0 0 1 21 46v-3z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Echo</span>
          <span class="sigil-hint">شست+کوچک</span>
        </span>
      </button>
<button class="sigil" data-mode="metal" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M26 40V16a3.2 3.2 0 0 1 6.4 0v20"/>
            <path d="M40 40V18a3.2 3.2 0 0 1 6.4 0v20"/>
            <path d="M26 40h20l1 5A11 11 0 0 1 36 58h-1A12 12 0 0 1 23 46v-3z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Horns</span>
          <span class="sigil-hint">شاخ</span>
        </span>
      </button>
<button class="sigil" data-mode="web" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M26 40V16a3.2 3.2 0 0 1 6.4 0v20"/>
            <path d="M40 40V18a3.2 3.2 0 0 1 6.4 0v20"/>
            <path d="M22 38c-1-5 1-10 6-12"/>
            <path d="M26 40h20l1 5A11 11 0 0 1 36 58h-1A12 12 0 0 1 23 46v-3z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Web</span>
          <span class="sigil-hint">شاخ+شست</span>
        </span>
      </button>
        </div>
      </div>
      <div class="sigil-row">
        <div class="sigil-rail sigil-rail-5" role="listbox" aria-label="تک‌دست">
<button class="sigil" data-mode="spite" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 42V14a3.5 3.5 0 0 1 7 0v28"/>
            <path d="M28 42h18l1 4A11 11 0 0 1 36 58h-1A12 12 0 0 1 23 46v-2z"/>
          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Spite</span>
          <span class="sigil-hint">انگشت وسط</span>
        </span>
      </button>
<button class="sigil" data-mode="ink" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M34 40V18a3.2 3.2 0 0 1 6.4 0v22"/>
            <path d="M40.4 38V16a3.2 3.2 0 0 1 6.4 0v24"/>

        </span>
        <span class="sigil-text">

        </span>
      </button>
<button class="sigil" data-mode="tide" type="button" disabled>

            <path d="M30.4 38V14a3.2 3.2 0 0 1 6.4 0v22"/>

      </div>

      </section>

      <section class="sigil-group sigil-group-duo">
        <header class="sigil-group-head">
          <span class="sigil-group-num">II</span>
          <div class="sigil-group-copy">
            <h2>Two Hands</h2>
            <p>هر دو دست هم‌زمان</p>
          </div>
        </header>
        <div class="sigil-rows">
      <div class="sigil-row">
        <div class="sigil-rail sigil-rail-5 sigil-rail-duo" role="listbox" aria-label="دو دست">

          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Keys</span>
          <span class="sigil-hint">کف پایین · دایره=خروج</span>

      </button>
<button class="sigil" data-mode="twin" type="button" disabled>

          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Twin</span>
          <span class="sigil-hint">۲× کف‌دست</span>
        </span>
      </button>
<button class="sigil" data-mode="bind" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 30h12l1 5a7 7 0 0 1-7 8h-1a8 8 0 0 1-8-8v-2z"/>

          </svg>
        </span>
        <span class="sigil-text">
          <span class="sigil-name">Bind</span>
          <span class="sigil-hint">۲× مشت</span>
        </span>
      </button>
<button class="sigil" data-mode="boost" type="button" disabled>
        <span class="sigil-hand" aria-hidden="true">
